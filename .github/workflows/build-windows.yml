name: Build Windows wheels

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish index to gh-pages after build"
        type: boolean
        default: true
  push:
    tags:
      - "v*"

jobs:
  # ---------------------------------------------------------------------------
  # Read matrix.yml into a JSON matrix that the build job can fan out over.
  # ---------------------------------------------------------------------------
  load-matrix:
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.load.outputs.builds }}
    steps:
      - uses: actions/checkout@v4
      - id: load
        shell: bash
        run: |
          python3 -m pip install pyyaml --quiet
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, yaml
          m = yaml.safe_load(open("matrix.yml"))
          print("builds=" + json.dumps(m["builds"]))
          PY

  # ---------------------------------------------------------------------------
  # Build one wheel per matrix row.
  # ---------------------------------------------------------------------------
  build:
    needs: load-matrix
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJson(needs.load-matrix.outputs.builds) }}
    runs-on: ${{ matrix.build.os }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.build.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.build.python }}

      - name: Checkout pytorch3d ${{ matrix.build.pytorch3d }}
        uses: actions/checkout@v4
        with:
          repository: facebookresearch/pytorch3d
          ref: v${{ matrix.build.pytorch3d }}
          path: pytorch3d-src

      # -- CUDA install (only when needed) -----------------------------------
      - name: Install CUDA Toolkit ${{ matrix.build.cuda }}
        if: matrix.build.cuda != 'cpu'
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: ${{ matrix.build.cuda }}.0
          method: network
          # Install the full toolkit. Picking sub-packages was brittle
          # because CUDA 13.0 reshuffled component names (e.g. there's no
          # cudart_dev_13.0; crt/host_config.h moved). The full install
          # adds ~5-10 min but eliminates per-version component archaeology.

      - name: Show CUDA env
        if: matrix.build.cuda != 'cpu'
        shell: cmd
        run: |
          echo CUDA_PATH=%CUDA_PATH%
          where nvcc
          nvcc --version

      # -- MSVC toolset -------------------------------------------------------
      # Per matrix row. Older torch (<=2.5) needs v142 / 14.29 to match
      # PyTorch's own wheel ABI; newer torch needs v143 (default) because
      # PyTorch 2.6+ forces -std=c++20 which v142 doesn't support.
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: ${{ matrix.build.msvc_toolset }}

      - name: Show compiler
        shell: cmd
        run: |
          where cl
          cl

      # -- Build --------------------------------------------------------------
      - name: Build wheel
        shell: cmd
        env:
          DISTUTILS_USE_SDK: "1"
        run: |
          python -m pip install --upgrade pip pyyaml
          python scripts\build_one.py ^
            --python "${{ matrix.build.python }}" ^
            --torch "${{ matrix.build.torch }}" ^
            --torchvision "${{ matrix.build.torchvision }}" ^
            --cuda "${{ matrix.build.cuda }}" ^
            --pytorch3d "${{ matrix.build.pytorch3d }}" ^
            --cuda-arch-list "${{ matrix.build.cuda_arch_list }}" ^
            --src pytorch3d-src ^
            --out wheels

      - name: Smoke test (import)
        shell: cmd
        run: |
          for %%f in (wheels\pytorch3d-*.whl) do python -m pip install "%%f"
          python -c "import pytorch3d; print('pytorch3d', pytorch3d.__version__)"
          python -c "import pytorch3d.ops; print('ops loaded')"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.build.name }}
          path: wheels/*.whl
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Collect all wheels, generate the PEP 503 index, deploy to gh-pages.
  # ---------------------------------------------------------------------------
  publish:
    needs: build
    if: ${{ github.event_name == 'push' || inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: wheel-*
          merge-multiple: true

      - name: List wheels
        run: |
          mkdir -p wheels
          find artifacts -name '*.whl' -exec cp {} wheels/ \;
          ls -la wheels/

      - name: Build PEP 503 index
        run: |
          python3 scripts/make_index.py --wheels wheels --out site/simple

      - name: Add landing page
        run: |
          mkdir -p site
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html><head><meta charset="utf-8">
          <title>pytorch3d-slicer-wheels</title></head>
          <body>
            <h1>pytorch3d wheels for 3D Slicer</h1>
            <p>This is a PEP 503 simple index.
               See <a href="simple/">simple/</a> for the package list.</p>
            <p>Install with:
              <pre>pip install --extra-index-url https://ImageMindAnalytics.github.io/pytorch3d-slicer-wheels/simple/ pytorch3d</pre>
            </p>
          </body></html>
          EOF

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          force_orphan: true
