# Build matrix for pytorch3d wheels.
# Each row produces exactly one wheel. Keep this small and explicit.
#
# Fields:
#   python        - cpython version (must match Slicer's bundled python)
#   torch         - exact torch version to build against
#   torchvision   - matching torchvision (informational, not always needed at build)
#   cuda          - "cpu" or a CUDA version like "12.4"
#   pytorch3d     - pytorch3d release tag (without leading v)
#   os            - github runner label
#   arch          - wheel platform tag
#   msvc_toolset  - "" for runner default (v143/VS2022), or e.g. "14.29" for v142.
#                   Match the toolset PyTorch's own wheels were built with:
#                     torch <= 2.5 -> "14.29"
#                     torch >= 2.6 -> ""  (v143 needed for -std=c++20)
#   cuda_arch_list - TORCH_CUDA_ARCH_LIST passed to nvcc. Set per-row because
#                    each CUDA major drops old arches:
#                      CUDA 12.x supports sm_60..sm_90
#                      CUDA 13.x drops sm_60/sm_70

builds:
  - name: slicer510-py312-torch260-cu124-win
    python: "3.12"
    torch: "2.6.0"
    torchvision: "0.21.0"
    cuda: "12.4"
    pytorch3d: "0.7.9"
    os: windows-2022
    arch: win_amd64
    msvc_toolset: ""
    cuda_arch_list: "7.0;7.5;8.0;8.6;8.9;9.0"

  - name: slicer510-py312-torch280-cu129-win
    python: "3.12"
    torch: "2.8.0"
    torchvision: "0.23.0"
    cuda: "12.9"
    pytorch3d: "0.7.9"
    os: windows-2022
    arch: win_amd64
    msvc_toolset: ""
    cuda_arch_list: "7.0;7.5;8.0;8.6;8.9;9.0"

  - name: slicer510-py312-torch280-cpu-win
    python: "3.12"
    torch: "2.8.0"
    torchvision: "0.23.0"
    cuda: "cpu"
    pytorch3d: "0.7.9"
    os: windows-2022
    arch: win_amd64
    msvc_toolset: ""
    cuda_arch_list: ""
